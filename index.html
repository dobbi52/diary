<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리들의 교환일기</title>
<meta name="theme-color" content="#DDE8E4">
<script>
  // 방 코드가 붙은 주소(?room=ABCDE)로 오면 바로 학생 화면으로
  (function () {
    var r = new URLSearchParams(location.search).get('room');
    if (r) location.replace('student.html?room=' + encodeURIComponent(r));
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
:root{--ink:#26324a;--sub:#44605b;--deep:#3D6B66;--paper:#FFFCF3;--line:#E3D9C4}
*{box-sizing:border-box}
html,body{margin:0;background:#DDE8E4;color:#2f3b39;font-family:'Gowun Dodum',sans-serif}
a{color:inherit;text-decoration:none}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;padding:34px 18px 40px;display:flex;flex-direction:column;gap:22px}
.note{position:relative;background:var(--paper);border-radius:4px 14px 14px 4px;box-shadow:0 8px 18px rgba(40,70,65,.18);padding:34px 22px 26px 52px}
.holes{position:absolute;left:14px;top:24px;bottom:24px;display:flex;flex-direction:column;justify-content:space-between}
.holes i{display:block;width:14px;height:14px;border-radius:50%;background:#DDE8E4;box-shadow:inset 0 2px 3px rgba(0,0,0,.25)}
.tape{position:absolute;top:-11px;width:110px;height:28px;opacity:.85}
h1{margin:0;font-family:'Gaegu',cursive;font-weight:700;font-size:clamp(30px,8.6vw,46px);white-space:nowrap;line-height:1.1;color:var(--ink)}
.lead{margin:10px 0 0;font-size:16px;line-height:1.7;color:var(--sub);word-break:keep-all}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:20px;position:relative}
.flow div{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:13px;color:#3c4f4b;line-height:1.35;word-break:keep-all}
.flow .ic{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.flow .ic svg{width:28px;height:28px}
.flow b{font-family:'Gaegu',cursive;font-size:19px;color:var(--ink);white-space:nowrap}
.flow div:not(:last-child)::after{content:'';position:absolute}
.arrow{position:absolute;top:24px;left:12%;right:12%;height:2px;background:repeating-linear-gradient(90deg,#9AB7B2 0 6px,transparent 6px 12px);z-index:0}
.flow div{position:relative;z-index:1}
.student{display:block;position:relative;background:var(--deep);color:#fff;border-radius:18px;padding:26px 86px 26px 24px;box-shadow:0 10px 20px rgba(40,70,65,.25);transition:transform .15s}
.student:hover,.student:focus-visible{transform:translateY(-3px)}
.student .t{font-family:'Gaegu',cursive;font-weight:700;font-size:clamp(28px,8vw,36px);white-space:nowrap;line-height:1.1}
.student .d{margin-top:6px;font-size:15px;opacity:.9}
.student .go{position:absolute;right:22px;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center}
.student .go svg{width:26px;height:26px}
.resume{display:none;margin-top:12px;background:#fff;color:var(--deep);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:700;width:max-content}
.teacher{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:2px solid #C9D8D4;border-radius:14px;padding:14px 18px;transition:border-color .15s}
.teacher:hover,.teacher:focus-visible{border-color:var(--deep)}
.teacher .t{font-weight:700;color:var(--deep);font-size:16px}
.teacher .d{font-size:13px;color:var(--sub);margin-top:2px}
.teacher svg{width:20px;height:20px;color:var(--deep);flex-shrink:0}
.foot{text-align:center;font-size:12px;color:#6b7f7b}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.a1{animation:up .45s ease-out both}.a2{animation:up .45s .12s ease-out both}.a3{animation:up .45s .22s ease-out both}
</style>
</head>
<body>
<main class="wrap">
  <section class="note a1">
    <div class="holes"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="tape" style="left:120px;background:rgba(240,170,150,.75);transform:rotate(-4deg)"></div>
    <h1>우리들의 교환일기</h1>
    <p class="lead">다른 학교 친구와 일기를 주고받아요.<br>내 하루를 들려주고, 쪽지를 뽑아 친구의 하루를 읽어요.</p>
    <div class="flow" aria-label="교환일기 흐름">
      <span class="arrow" aria-hidden="true"></span>
      <div><span class="ic" style="background:#E6F1EE;color:#3D6B66"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/></svg></span><b>쓰기</b>필명으로<br>내 하루를</div>
      <div><span class="ic" style="background:#FFF4C7;color:#8a6500"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></span><b>확인</b>읽어 보고<br>보내 줘요</div>
      <div><span class="ic" style="background:#DCE3F6;color:#2B3570"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h14v16H5z"/><path d="M5 12h14M9 2h6"/></svg></span><b>뽑기</b>다른 학교<br>친구 일기</div>
      <div><span class="ic" style="background:#F7C9C0;color:#6B2A20"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.8 6.6 19.7l1.1-6.1L3.2 9.4l6.1-.8z"/></svg></span><b>스티커</b>마음을<br>전해요</div>
    </div>
  </section>

  <a class="student a2" href="student.html">
    <div class="t">학생으로 들어가기</div>
    <div class="d">선생님께 받은 방 코드로 들어와요</div>
    <div class="resume" id="resume"></div>
    <span class="go" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span>
  </a>

  <a class="teacher a3" href="teacher.html">
    <div><div class="t">선생님으로 들어가기</div><div class="d">생각 오락실 계정과 교사 초대 코드가 필요해요</div></div>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
  </a>

  <p class="foot">모든 일기는 선생님이 먼저 읽고 보내요.</p>
</main>
<script>
  try {
    var me = JSON.parse(localStorage.getItem('diary:me') || 'null');
    if (me && me.no) { var r = document.getElementById('resume'); r.textContent = me.no + '번으로 이어서 하기'; r.style.display = 'block'; }
  } catch (e) {}
</script>
</body>
</html>
